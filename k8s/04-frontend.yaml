apiVersion: apps/v1
kind: Deployment
metadata:
  name: personalpodcast-frontend
  namespace: personalpodcast
  labels:
    app: personalpodcast-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: personalpodcast-frontend
  template:
    metadata:
      labels:
        app: personalpodcast-frontend
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: web
          image: personalpodcast.azurecr.io/personalpodcast-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: personalpodcast
spec:
  selector:
    app: personalpodcast-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP